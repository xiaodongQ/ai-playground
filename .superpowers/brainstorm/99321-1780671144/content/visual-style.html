<h2>Skill Factory — 视觉风格选择</h2>
<p class="subtitle">哪种风格更符合你想要的体验？</p>

<div class="options">
  <div class="option" data-choice="minimal" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>极简科技风</h3>
      <p>白底 +细线条 + 淡雅配色，大量留白，专注内容</p>
      <div style="margin-top:12px;display:flex;gap:4px">
        <span style="width:20px;height:20px;background:#fff;border:1px solid #ddd;border-radius:4px;display:inline-block"></span>
        <span style="width:20px;height:20px;background:#2563eb;border-radius:4px;display:inline-block"></span>
        <span style="width:20px;height:20px;background:#10b981;border-radius:4px;display:inline-block"></span>
        <span style="width:20px;height:20px;background:#f59e0b;border-radius:4px;display:inline-block"></span>
      </div>
    </div>
  </div>

  <div class="option" data-choice="dark" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>深色极客风</h3>
      <p>深色背景 + 霓虹强调色，代码感强，专业工具气质</p>
      <div style="margin-top:12px;display:flex;gap:4px">
        <span style="width:20px;height:20px;background:#0f172a;border-radius:4px;display:inline-block"></span>
        <span style="width:20px;height:20px;background:#22d3ee;border-radius:4px;display:inline-block"></span>
        <span style="width:20px;height:20px;background:#a78bfa;border-radius:4px;display:inline-block"></span>
        <span style="width:20px;height:20px;background:#f472b6;border-radius:4px;display:inline-block"></span>
      </div>
    </div>
  </div>

  <div class="option" data-choice="warm" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>温暖专业风</h3>
      <p>暖白底 + 柔和圆角 + 微妙的阴影层次，亲和但不失专业</p>
      <div style="margin-top:12px;display:flex;gap:4px">
        <span style="width:20px;height:20px;background:#fefce8;border-radius:4px;display:inline-block"></span>
        <span style="width:20px;height:20px;background:#3b82f6;border-radius:4px;display:inline-block"></span>
        <span style="width:20px;height:20px;background:#84cc16;border-radius:4px;display:inline-block"></span>
        <span style="width:20px;height:20px;background:#f97316;border-radius:4px;display:inline-block"></span>
      </div>
    </div>
  </div>
</div>
